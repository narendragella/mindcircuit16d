---
  apiVersion: apps/v1
  kind: Deployment
  metadata: 
    name: microservices-deployment
  spec:
    replicas: 5
    selector:
      matchLabels:
        name: microservices-pod
    template:
      metadata:
        labels:
          name: microservices-pod
      spec:
       containers:
        - name: microservices-container
          image: narendragella/docker:latest
          ports:
           - containerPort: 8080
